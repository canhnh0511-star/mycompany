spring:
  application:
    name: api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mycompany}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway sở hữu schema (xem docs/adr/0003-flyway-for-migrations.md) — Hibernate chỉ validate,
      # KHÔNG bao giờ tự tạo/sửa bảng.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    # Nguồn migration DUY NHẤT là db/migrations ở gốc repo (không copy vào resources) — tránh 2 bản lệch nhau.
    # Giả định chạy từ working directory services/api (mặc định khi chạy ./gradlew hoặc IDE run config).
    locations: filesystem:../../db/migrations
    sql-migration-prefix: ""
    sql-migration-separator: "_"
    sql-migration-suffixes: .sql
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

# Swagger UI / OpenAPI spec (docs/TASKS.md Phase 5) — BẬT theo mặc định (dev/local/staging chưa đặt
# profile). Bị TẮT hẳn ở profile "prod" (xem application-prod.yml) — khi deploy thật, đặt biến môi
# trường SPRING_PROFILES_ACTIVE=prod để kích hoạt override này (chưa có ở .env hiện tại vì chưa deploy
# thật, xem docs/TASKS.md Open Question về profile prod).
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  cors:
    # Origin của Expo web dev server (đổi CORS_ALLOWED_ORIGINS khi deploy — CSV các origin, không dùng "*"
    # vì request có gửi Authorization header). 8081 là cổng mặc định "expo start --web" ở SDK hiện tại;
    # 19006 giữ lại cho tương thích các cấu hình Expo cũ hơn.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  jwt:
    # KHÔNG commit secret thật — đặt qua biến môi trường JWT_SECRET (xem application-secrets.yml.example)
    secret: ${JWT_SECRET:CHANGE_ME_IN_ENV_LOCAL_DEV_ONLY_DO_NOT_USE_IN_PROD}
    # 1 ngày, không refresh token (docs/adr/0004-auth-simplified-for-v1.md)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  anthropic:
    # Rỗng ở dev nếu chưa điền ANTHROPIC_API_KEY trong .env — luồng OCR sẽ lỗi rõ ràng (401 từ
    # Claude API, ghi vào ocr_call_logs.success=false) thay vì crash lúc khởi động.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:receipt-photos}
    # 5MB — đúng giới hạn ảnh base64 của Claude Vision API (docs/TASKS.md Open Question, resolved 2026-08-06)
    max-upload-bytes: ${SUPABASE_MAX_UPLOAD_BYTES:5242880}
    allowed-content-types: ${SUPABASE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png}
